databases:
  - name: flipkart-bites-db
    plan: free
    databaseName: flipkart_bites
    user: flipkart_bites

services:
  - type: web
    name: flipkart-bites-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flipkart-bites-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "43200"
      - key: CORS_ORIGINS
        value: https://flipkart-bites.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: flipkart-bites
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://flipkart-bites-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
